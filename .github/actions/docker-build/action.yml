name: 'Build Docker Image'
description: 'Builds a Docker image with IsaacSim and IsaacLab dependencies'

inputs:
  image-tag:
    description: 'Docker image tag to use'
    required: true
  isaacsim-base-image:
    description: 'IsaacSim base image'
    required: true
  isaacsim-version:
    description: 'IsaacSim version'
    required: true
  base-dockerfile-path:
    description: 'Path to base Dockerfile (built first before the main dockerfile)'
    default: 'docker/Dockerfile.base'
    required: false
  dockerfile-path:
    description: 'Path to Dockerfile'
    default: 'docker/Dockerfile.curobo'
    required: false
  context-path:
    description: 'Build context path'
    default: '.'
    required: false

runs:
  using: composite
  steps:
    - name: NGC Login
      shell: sh
      run: |
        # Only attempt NGC login if API key is available
        if [ -n "${{ env.NGC_API_KEY }}" ]; then
          echo "Logging into NGC registry..."
          docker login -u \$oauthtoken -p ${{ env.NGC_API_KEY }} nvcr.io
          echo "✅ Successfully logged into NGC registry"
        else
          echo "⚠️ NGC_API_KEY not available - skipping NGC login"
          echo "This is normal for PRs from forks or when secrets are not configured"
        fi

    - name: Build Base Docker Image
      shell: sh
      run: |
        # Build the base Isaac Lab image first
        # This is required because Dockerfile.curobo extends from isaac-lab-base
        echo "Building base Docker image: isaac-lab-base"
        echo "Using Dockerfile: ${{ inputs.base-dockerfile-path }}"
        echo "Build context: ${{ inputs.context-path }}"

        docker buildx build --progress=plain --platform linux/amd64 \
          -t isaac-lab-base \
          --build-arg ISAACSIM_BASE_IMAGE_ARG="${{ inputs.isaacsim-base-image }}" \
          --build-arg ISAACSIM_VERSION_ARG="${{ inputs.isaacsim-version }}" \
          --build-arg ISAACSIM_ROOT_PATH_ARG=/isaac-sim \
          --build-arg ISAACLAB_PATH_ARG=/workspace/isaaclab \
          --build-arg DOCKER_USER_HOME_ARG=/root \
          --cache-from type=gha,scope=base \
          --cache-to type=gha,mode=max,scope=base \
          -f ${{ inputs.base-dockerfile-path }} \
          --load ${{ inputs.context-path }}

        echo "Base Docker image built successfully: isaac-lab-base"

    - name: Build cuRobo Docker Image
      shell: sh
      run: |
        # Build the cuRobo image on top of the base image
        echo "Building Docker image: ${{ inputs.image-tag }}"
        echo "Using Dockerfile: ${{ inputs.dockerfile-path }}"
        echo "Build context: ${{ inputs.context-path }}"

        docker buildx build --progress=plain --platform linux/amd64 \
          -t isaac-lab-dev \
          -t ${{ inputs.image-tag }} \
          --build-arg DOCKER_NAME_SUFFIX="" \
          --cache-from type=gha,scope=curobo \
          --cache-to type=gha,mode=max,scope=curobo \
          -f ${{ inputs.dockerfile-path }} \
          --load ${{ inputs.context-path }}

        echo "✅ Docker image built successfully: ${{ inputs.image-tag }}"
        docker images | grep isaac-lab
